name: Reference library
on: [push, pull_request]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.23'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: uv sync --locked
        working-directory: engine
      - run: uv run ruff check && uv run ruff format --check && uv run mypy --strict src && uv run pytest -q
        working-directory: engine
      - run: diff -r schema spec/schema && diff -r examples/web spec/examples/web
      - run: uv build --wheel
        working-directory: engine
      - uses: actions/upload-artifact@v4
        with:
          name: nostrobe-wheel
          path: engine/dist/*.whl
